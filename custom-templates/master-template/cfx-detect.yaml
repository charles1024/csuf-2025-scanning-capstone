id: cfx-detect
info:
  name: Master Apache Technology Detect
  author: max-and-demi

http:
  # Apache CFX
  - method: GET
    path:
      - "{{BaseURL}}/test?wsdl"
      - "{{BaseURL}}/cfx/"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "wsdl:definitions"
          - "Apache CXF"
    extractors:
      - type: regex
        name: apache-cfx
        regex:
          - "Apache CXF ([0-9]+\\.[0-9]+\\.[0-9]+)"