id: apache-detect
info:
  name: Base-Apache-Detection
  author: cyber-squadd

http:
  - method: GET
    stop-at-first-match: true

    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "TornadoServer"
        name: airflow

  - method: GET
    stop-at-first-match: true
    path:
      - "{{BaseURL}}/control/main"
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "OFBiz.Visitor="
          - "Apache OFBiz"
        condition: or
        name: ofbiz

      - type: dsl
        dsl:
          - 'contains(tolower(body), "apache tomcat")'
          - 'contains(tolower(body), "/manager/html")'
          - 'contains(tolower(body), "/manager/status")'
        condition: or
        name: tomcat

