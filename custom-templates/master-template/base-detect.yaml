id: apache-detect
info:
  name: Base-Apache-Detection
  author: cyber-squadd

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        name: airflow
        words:
          - "Airflow 404"


      - type: word
        part: response
        words:
          - "OFBiz.Visitor="
          - "Apache OFBiz"
        condition: or
        name: ofbiz
		
      - type: regex
        name: tomcat
        part: body
        regex:
          - "Tomcat/([0-9]+\\.[0-9]+\\.[0-9]+)"
          
      - type: word
        part: body
        name: apache-cfx
        words:
          - "wsdl:definitions"
          - "Apache CXF"
    