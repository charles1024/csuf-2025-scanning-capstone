id: apache-admin-forgot-password
info:
  name: Apache Admin Forgot Password Link
  author: max-demi
  severity: info
  description: Detects if the Apache admin page has a forgot password link
tags: custom,apache,precheck
http:
  - method: GET
    path:
      - "/admin"
      - "/login"
    matchers:
      - type: word
        part: body
        words:
          - "Forgot your password?"
      - type: status
        status:
          - 200