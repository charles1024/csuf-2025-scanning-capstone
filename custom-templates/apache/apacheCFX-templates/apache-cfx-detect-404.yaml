id: apache-cfx-detect-404

info:
  name: Apache cfx
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:cfx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: cfx
    shodan-query: http.html:"Apache cfx"
  tags: tech,apache,cfx,intrusive

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "HTTP ERROR 404 Not Found"
