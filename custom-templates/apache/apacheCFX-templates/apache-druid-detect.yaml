id: apache-druid-detect

info:
  name: Apache druid
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:druid:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: druid
    shodan-query: http.html:"Apache druid"
  tags: tech,apache,druid,intrusive

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "unified-console"
