id: apache-tomcat-detect

info:
  name: Apache tomcat
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:tomcat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: tomcat
    shodan-query: http.html:"Apache tomcat"
  tags: tech,apache,tomcat,intrusive

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<pre>$CATALINA_HOME/conf/tomcat-users.xml</pre>"
          - "<a href=\"http://tomcat.apache.org/download-connectors.cgi\">Tomcat Connectors</a>"
          
      - type: regex
        part: body
        regex:
          - '(?i)Apache Tomcat\/[0-9.]+'
