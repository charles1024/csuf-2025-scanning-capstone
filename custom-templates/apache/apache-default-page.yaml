id: apache-default-page
info:
  name: Apache Default Page Detection
  author: max-demi
  severity: info
  description: Detects if a server is running a default Apache HTTP page
tags: custom,apache,precheck
http:
  - method: GET
    path:
      - "/"
    matchers:
      - type: word
        part: body
        words:
          - "It works!"
      - type: status
        status:
          - 200
